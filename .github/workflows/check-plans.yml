name: Check synchronized plans
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  plans:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courses/olympiad-math-10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install system XML library
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-lxml
      - name: Build both plan sources and submission document
        run: |
          python3 scripts/make_course.py
          python3 scripts/publish.py
          python3 scripts/build_submission.py
          python3 scripts/check_plans.py --submission-only
          node scripts/check_catalog.js
      - name: Check generated text is committed
        run: git diff --exit-code -- README.md data/lessons.json data/submission-map.json course research site
